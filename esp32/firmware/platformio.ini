; microClocks ESP32 — Waveshare ESP32-S3-Touch-AMOLED-2.06 (410 x 502, CO5300, FT3168, PCF85063)
; https://docs.waveshare.com/ESP32-S3-Touch-AMOLED-2.06
;
; Arduino_GFX braucht für CO5300/QSPI Arduino-ESP32 3.x; das Standard-espressif32 bringt noch 2.0.x.
; pioarduino 55.03.32 (Arduino 3.3.2) ist auf diesem Rechner bereits aus dem Projekt esp2 installiert.

[platformio]
default_envs = amoled206

[env:amoled206]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
; Das Board hat 32 MB Flash; 16 MB reichen und vermeiden den 32-MB-Sonderfall im QIO-Modus.
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

upload_speed = 921600
monitor_speed = 115200
monitor_filters = time, default

build_flags =
    -Wall
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM

lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.0

platform_packages =
    tool-esptoolpy@https://github.com/pioarduino/registry/releases/download/0.0.1/esptoolpy-v5.1.0.zip
