<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<title>Bangle Fliegenuhr</title>
	<style>
		body { margin: 0; padding: 16px; background: #222; color: #aaa; font: 14px system-ui, sans-serif; }
		canvas { width: 528px; height: 528px; image-rendering: pixelated; background: #000; border-radius: 24px; cursor: pointer; }
	</style>
</head>
<body>
	<canvas id="glass" width="176" height="176"></canvas>
	<p>Bangle.js 2 · 176 × 176 · 3-Bit-Farben · Klick scheucht die Fliegen auf · S schüttelt die Uhr</p>
	<script>
		// Nachbildung der Espruino-Grafik, soweit FlyClock.js sie benutzt. Farben sind 3-Bit-Werte (RGB-Bits).
		const canvas = document.getElementById('glass');
		const ctx = canvas.getContext('2d');
		const rgb = (c) => [c & 4 ? 255 : 0, c & 2 ? 255 : 0, c & 1 ? 255 : 0];
		const toColor = (r, gg, b) => gg === undefined ? (r ? 7 : 0) : (r >= .5) << 2 | (gg >= .5) << 1 | (b >= .5);
		let bg = 7;
		const g = {
			theme: { fg: 0, bg: 7 },
			getWidth: () => canvas.width,
			getHeight: () => canvas.height,
			toColor,
			reset() { bg = 7; return g; },
			setBgColor(r, gg, b) { bg = toColor(r, gg, b); return g; },
			clear() { return g.clearRect(0, 0, canvas.width - 1, canvas.height - 1); },
			clearRect(x0, y0, x1, y1) { ctx.fillStyle = `rgb(${rgb(bg)})`; ctx.fillRect(x0, y0, x1 - x0 + 1, y1 - y0 + 1); return g; },
			drawImage(img, x, y) {
				const bytes = new Uint8Array(img.buffer);
				const out = ctx.getImageData(x, y, img.width, img.height);
				for (let i = 0; i < img.width * img.height; i++) {
					const bit = i * img.bpp;
					const index = (bytes[bit >> 3] >> (8 - img.bpp - (bit & 7))) & ((1 << img.bpp) - 1);
					if (index === img.transparent) continue;
					out.data.set([...rgb(img.palette[index]), 255], i * 4);
				}
				ctx.putImageData(out, x, y);
				return g;
			},
		};
		const atob = window.atob.bind(window);
		const E = { toArrayBuffer: (s) => Uint8Array.from(s, (c) => c.charCodeAt(0)).buffer };
		const listeners = {};
		const Bangle = { setUI() {}, on(event, fn) { listeners[event] = fn; }, removeListener() {}, loadWidgets() {}, isLocked: () => false };
		const require = () => ({ hide() {}, show() {} });
		canvas.addEventListener('click', (event) => {
			const scale = canvas.width / canvas.getBoundingClientRect().width;
			listeners.touch?.(1, { x: event.offsetX * scale, y: event.offsetY * scale });
		});
		window.addEventListener('keydown', (event) => {
			if (event.key !== 's' && event.key !== 'S') return;
			for (let i = 0; i < 3; i++) listeners.accel?.({ x: 0, y: 0, z: -1, diff: 2, mag: 2 });
		});
		fetch('../FlyClock.js', { cache: 'no-store' }).then((response) => response.text()).then((code) => eval(code));
	</script>
</body>
</html>
